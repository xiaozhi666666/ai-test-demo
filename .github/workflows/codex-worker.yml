name: Codex Worker

on:
  push:
    branches:
      - main
    paths:
      - 'tasks/current.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  codex-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Parse Task Information
        id: parse-task
        run: |
          # 从 tasks/current.md 解析任务信息
          PROBLEM_NUMBER=$(grep "Problem:" tasks/current.md | awk '{print $NF}')
          PROBLEM_TITLE=$(grep "Title:" tasks/current.md | awk -F': ' '{print $NF}')
          DIFFICULTY=$(grep "Difficulty:" tasks/current.md | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          PROBLEM_LINK=$(grep "Link:" tasks/current.md | awk '{print $NF}')

          echo "problem_number=$PROBLEM_NUMBER" >> $GITHUB_OUTPUT
          echo "problem_title=$PROBLEM_TITLE" >> $GITHUB_OUTPUT
          echo "difficulty=$DIFFICULTY" >> $GITHUB_OUTPUT
          echo "problem_link=$PROBLEM_LINK" >> $GITHUB_OUTPUT

          # 生成文件名（移除空格，转小写，用连字符连接）
          FILE_NAME=$(echo "$PROBLEM_TITLE" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          echo "file_name=${DIFFICULTY}-$(printf '%03d' $PROBLEM_NUMBER)-${FILE_NAME}.ts" >> $GITHUB_OUTPUT

      - name: Generate Code with OpenAI
        id: generate-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 读取系统提示和任务内容
          SYSTEM_PROMPT=$(cat ai-config/codex/system-prompt.md)
          TASK_CONTENT=$(cat tasks/current.md)

          # 调用 OpenAI API 生成代码
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-4",
              "messages": [
                {"role": "system", "content": "'"$SYSTEM_PROMPT"'"},
                {"role": "user", "content": "'"$TASK_CONTENT"'"}
              ],
              "temperature": 0.3,
              "max_tokens": 2000
            }')

          # 提取生成的代码
          CODE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          # 保存到文件
          echo "$CODE" > "src/problems/${{ steps.parse-task.outputs.file_name }}"

          echo "Generated code saved to: src/problems/${{ steps.parse-task.outputs.file_name }}"

      - name: Run Tests
        id: run-tests
        continue-on-error: true
        run: |
          npm run test:single "src/problems/${{ steps.parse-task.outputs.file_name }}" > test-output.txt 2>&1
          cat test-output.txt

      - name: Create Pull Request Branch
        run: |
          BRANCH_NAME="codex/problem-${{ steps.parse-task.outputs.problem_number }}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git config user.name "Codex Bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add .
          git commit -m "feat: implement LeetCode #${{ steps.parse-task.outputs.problem_number }} - ${{ steps.parse-task.outputs.problem_title }}"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 读取测试输出
          TEST_OUTPUT=$(cat test-output.txt || echo "No test output available")

          # 准备 PR 描述
          PR_BODY=$(cat << 'EOF'
          # 🤖 Codex Auto-Generated Solution

          ## 📝 Problem Information

          - **Problem**: #${{ steps.parse-task.outputs.problem_number }}
          - **Title**: ${{ steps.parse-task.outputs.problem_title }}
          - **Difficulty**: ${{ steps.parse-task.outputs.difficulty }}
          - **Link**: [${{ steps.parse-task.outputs.problem_link }}](${{ steps.parse-task.outputs.problem_link }})

          ## ✅ Test Results

          ```
          ${TEST_OUTPUT}
          ```

          ## 📋 Checklist

          - [x] Code implemented
          - [x] Test cases added
          - [x] Code passes all tests
          - [ ] Reviewed by Claude Code
          - [ ] Approved for merge

          ---

          **Generated by**: Codex via GitHub Actions
          **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Branch**: ${BRANCH_NAME}

          ## 🔍 Next Steps

          Waiting for Claude Code review. Once approved, this PR will be merged automatically.
          EOF
          )

          # 创建 PR（不添加标签，避免标签不存在的错误）
          PR_URL=$(gh pr create \
            --title "🤖 Codex: LeetCode #${{ steps.parse-task.outputs.problem_number }} - ${{ steps.parse-task.outputs.problem_title }}" \
            --body "$PR_BODY" \
            --base main)

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "PR created: $PR_URL"

          # 获取 PR 编号
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # 尝试添加标签（如果标签不存在会失败，但不影响 PR 创建）
          gh pr edit "$PR_NUMBER" --add-label "codex-generated" 2>/dev/null || echo "Label 'codex-generated' not found, skipping"

      - name: Comment on Test Failure
        if: steps.run-tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          gh pr comment "$PR_NUMBER" --body "⚠️ 测试失败，请 Claude Code 审查并修复"
          # 尝试添加标签（如果标签不存在会失败，但不影响评论）
          gh pr edit "$PR_NUMBER" --add-label "test-failed" 2>/dev/null || echo "Label 'test-failed' not found, skipping"
